<script>
/* =========================================================
   SISTEMA DE PROVA GATE
   ---------------------------------------------------------
   Código escrito de forma EXPLÍCITA e DIDÁTICA
   - Sem compactação
   - Sem redução artificial de linhas
   - Ideal para leitura, estudo e GitHub
   ========================================================= */

/* ========================
   CONFIGURAÇÕES GERAIS
======================== */

// Duração total da prova em segundos (20 minutos)
const EXAM_DURATION_SECONDS = 20 * 60;

// Quantidade mínima de acertos para aprovação
const PASSING_SCORE_MINIMUM = 15;

// Quantidade total de questões
const TOTAL_QUESTIONS = 20;

// Webhook do Discord (mantido conforme solicitado)
const WEBHOOK_URL = "https://discord.com/api/webhooks/1461806116987212071/LF2QtlSC7wpwHHiMPZsGWgn9orRG4BCjS2r5GRa0f3GRAndohmirBYnC-QTvPddDum8q";

/* ========================
   ESTADO DA PROVA
======================== */

// Tempo restante da prova
let timeRemainingSeconds = EXAM_DURATION_SECONDS;

// Intervalo do timer
let timerIntervalId = null;

// Controle para impedir múltiplos envios
let examAlreadySubmitted = false;

// Momento exato de início da prova
let examStartTimestamp = Date.now();

// Lista de alertas de comportamento suspeito
let suspiciousFlags = [];

/* ========================
   QUESTÕES
======================== */

const questions = [
  ["A prática de corrupção é:", ["Extremamente inadmissível", "Permitida em casos especiais", "Opcional conforme situação", "Aceitável se necessário"], 0],
  ["O policial deve obedecer:", ["A hierarquia e as leis", "Somente autoridades civis", "Apenas a imprensa", "Qualquer pessoa"], 0],
  ["O CPPM regula:", ["Conduta e processos militares", "Somente crimes civis", "Apenas infrações de trânsito", "Questões econômicas"], 0],
  ["Ordem manifestamente ilegal deve ser:", ["Questionada e não cumprida", "Cumprida sem questionar", "Ignorada sem comunicar", "Divulgada publicamente"], 0],
  ["Infração disciplinar leve gera:", ["Advertência ou multa", "Prisão imediata", "Exoneração", "Nenhuma consequência"], 0],
  ["O policial pode se omitir diante de crime?", ["Nunca, deve agir", "Sempre pode escolher", "Às vezes é permitido", "Se não estiver de serviço"], 0],
  ["O uso da força deve ser:", ["Proporcional e necessário", "Sempre excessivo", "Livre e irrestrito", "Conforme vontade do agente"], 0],
  ["A hierarquia militar garante:", ["Disciplina e organização", "Favorecimento pessoal", "Desordem controlada", "Impunidade dos superiores"], 0],
  ["Quem viola o CPPM:", ["Sofre punição disciplinar", "Recebe promoção", "Ganha benefícios", "Não sofre consequências"], 0],
  ["Lealdade institucional é:", ["Obrigatória e fundamental", "Opcional conforme conveniência", "Temporária", "Irrelevante para a carreira"], 0],
  ["Transgressão disciplinar é:", ["Infração às normas militares", "Motivo de elogio", "Razão para medalha", "Critério de promoção"], 0],
  ["O policial deve proteger primordialmente:", ["A vida e dignidade humana", "Somente patrimônio", "A si mesmo primeiro", "Apenas a corporação"], 0],
  ["Ordem obscura ou duvidosa deve ser:", ["Esclarecida antes da execução", "Cumprida sem questionar", "Ignorada completamente", "Divulgada nas redes"], 0],
  ["O policial responde por omissão?", ["Sim, pode ser punido", "Não, nunca", "Apenas criminalmente", "Somente em caso civil"], 0],
  ["A hierarquia serve para:", ["Organização e eficiência", "Permitir abusos", "Favorecimento pessoal", "Causar confusão"], 0],
  ["Conduta ética no serviço público é:", ["Obrigatória sempre", "Opcional conforme caso", "Rara na prática", "Motivo de punição"], 0],
  ["A disciplina é base da:", ["Instituição militar", "Anarquia organizada", "Desordem funcional", "Prática fraudulenta"], 0],
  ["Quem desrespeita as normas:", ["É punido conforme regras", "É premiado", "Não sofre nada", "É promovido"], 0],
  ["A autoridade do policial vem:", ["Da função e da lei", "Apenas da força física", "De ameaças", "Do porte de arma"], 0],
  ["O policial deve agir com:", ["Imparcialidade e justiça", "Favorecimento a conhecidos", "Interesse pessoal", "Busca de vantagens"], 0]
];

/* ========================
   RENDERIZAÇÃO DAS QUESTÕES
======================== */

function renderQuestions() {
  const form = document.getElementById("examForm");

  for (let questionIndex = 0; questionIndex < questions.length; questionIndex++) {

    const questionData = questions[questionIndex];

    // Card da questão
    const questionCard = document.createElement("div");
    questionCard.className = "question-card";

    // Cabeçalho da questão
    const header = document.createElement("div");
    header.className = "question-header";

    const number = document.createElement("div");
    number.className = "question-number";
    number.textContent = questionIndex + 1;

    const text = document.createElement("div");
    text.className = "question-text";
    text.textContent = questionData[0];

    header.appendChild(number);
    header.appendChild(text);

    // Opções
    const optionsContainer = document.createElement("div");
    optionsContainer.className = "options";

    for (let optionIndex = 0; optionIndex < questionData[1].length; optionIndex++) {

      const optionWrapper = document.createElement("div");
      optionWrapper.className = "option";

      const radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "q" + questionIndex;
      radio.value = optionIndex;
      radio.id = "q" + questionIndex + "_" + optionIndex;

      const label = document.createElement("label");
      label.className = "option-label";
      label.htmlFor = radio.id;
      label.textContent = questionData[1][optionIndex];

      optionWrapper.appendChild(radio);
      optionWrapper.appendChild(label);
      optionsContainer.appendChild(optionWrapper);
    }

    questionCard.appendChild(header);
    questionCard.appendChild(optionsContainer);
    form.appendChild(questionCard);
  }
}

/* ========================
   PROGRESSO DA PROVA
======================== */

function updateProgress() {
  let answeredCount = 0;

  for (let i = 0; i < TOTAL_QUESTIONS; i++) {
    const selected = document.querySelector('input[name="q' + i + '"]:checked');
    if (selected) {
      answeredCount++;
    }
  }

  const percent = (answeredCount / TOTAL_QUESTIONS) * 100;

  document.getElementById("progressBar").style.width = percent + "%";
  document.getElementById("progressText").textContent = answeredCount + "/" + TOTAL_QUESTIONS;
}

/* ========================
   TIMER
======================== */

function startTimer() {
  const display = document.getElementById("timerDisplay");

  timerIntervalId = setInterval(function () {

    if (examAlreadySubmitted) {
      clearInterval(timerIntervalId);
      return;
    }

    timeRemainingSeconds--;

    const minutes = Math.floor(timeRemainingSeconds / 60);
    const seconds = timeRemainingSeconds % 60;

    display.textContent =
      String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");

    if (timeRemainingSeconds <= 300) {
      display.classList.add("critical");
    }

    if (timeRemainingSeconds <= 0) {
      clearInterval(timerIntervalId);
      submitExam(true);
    }

  }, 1000);
}

/* ========================
   CÁLCULO DA NOTA
======================== */

function calculateScore() {
  let correct = 0;

  for (let i = 0; i < questions.length; i++) {
    const selected = document.querySelector('input[name="q' + i + '"]:checked');
    if (selected && Number(selected.value) === questions[i][2]) {
      correct++;
    }
  }

  return correct;
}

/* ========================
   ENVIO DA PROVA
======================== */

async function submitExam(autoSubmit) {
  if (examAlreadySubmitted) return;

  const discordId = document.getElementById("discordId").value.trim();
  const userName = document.getElementById("userName").value.trim();

  if (!/^[0-9]{17,19}$/.test(discordId)) {
    showMessage("ID do Discord inválido.", "error");
    return;
  }

  examAlreadySubmitted = true;
  clearInterval(timerIntervalId);

  const correct = calculateScore();
  const wrong = TOTAL_QUESTIONS - correct;
  const percentage = ((correct / TOTAL_QUESTIONS) * 100).toFixed(1);
  const passed = correct >= PASSING_SCORE_MINIMUM;

  const timeUsed = EXAM_DURATION_SECONDS - timeRemainingSeconds;

  if (timeUsed < 120 && correct === TOTAL_QUESTIONS) {
    suspiciousFlags.push("⚠️ Prova concluída em tempo incompatível");
  }

  await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content: suspiciousFlags.join("\n") || null,
      embeds: [{
        title: "📊 RESULTADO DA PROVA GATE",
        color: passed ? 0x00d4aa : 0xff5757,
        fields: [
          { name: "Candidato", value: userName || "Não informado", inline: true },
          { name: "Discord", value: "<@" + discordId + ">", inline: true },
          { name: "Pontuação", value: correct + "/" + TOTAL_QUESTIONS, inline: true },
          { name: "Percentual", value: percentage + "%", inline: true },
          { name: "Status", value: passed ? "APROVADO" : "REPROVADO", inline: true }
        ],
        timestamp: new Date().toISOString()
      }]
    })
  });

  showResult(correct, wrong, percentage, passed, timeUsed);
}

/* ========================
   RESULTADO FINAL
======================== */

function showResult(correct, wrong, percentage, passed, timeUsed) {
  document.getElementById("examSection").classList.add("hidden");

  const minutes = Math.floor(timeUsed / 60);
  const seconds = timeUsed % 60;

  document.getElementById("resultIcon").textContent = passed ? "🎉" : "😔";
  document.getElementById("resultTitle").textContent = passed ? "APROVADO!" : "REPROVADO";
  document.getElementById("resultScore").textContent = correct + "/" + TOTAL_QUESTIONS;
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  document.getElementById("percentage").textContent = percentage + "%";
  document.getElementById("timeUsed").textContent =
    minutes + ":" + String(seconds).padStart(2, "0");

  document.getElementById("resultSection").classList.add("show");
}

/* ========================
   MENSAGENS
======================== */

function showMessage(text, type) {
  const box = document.getElementById("messageBox");
  box.textContent = text;
  box.className = "message " + type;

  setTimeout(function () {
    box.className = "message";
  }, 5000);
}

/* ========================
   INICIALIZAÇÃO
======================== */

document.addEventListener("DOMContentLoaded", function () {
  renderQuestions();
  startTimer();
  document.getElementById("examForm").addEventListener("change", updateProgress);
});
</script>
